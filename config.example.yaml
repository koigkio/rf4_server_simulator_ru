# Шаблон конфигурации rf4server.
# Скопируйте в config.yaml и замените все секреты-заглушки.
# config.yaml исключён через .gitignore.

env: dev             # Окружение: dev | prod
log:
  level: info        # Уровень журнала: debug | info | warn | error
  format: text       # Формат журнала: text | json

launcher:
  game_path: ""      # Абсолютный путь к rf4_x64.exe; можно сохранить и в центре управления.
  game_region: "RU"  # Значение параметра -region при запуске игры.
  launch_via: "steam" # Способ запуска: steam — через клиент Steam (steam.exe -applaunch), direct — напрямую rf4_x64.exe.
  steam_app_id: 766570 # AppID Russian Fishing 4 в Steam.
  hosts_switch: false # true: после запуска сервисов api.rf4game.ru/com автоматически направляются на 127.0.0.1, при выходе лаунчера восстанавливаются; нужен запуск от имени администратора.

sqlite:
  path: "data/rf4server.db"                  # Основная база, общая для всех процессов сервера.
  static_path: "server_data/static.sqlite3" # Статический каталог, подключается только для чтения.

gateway:
  login_addr: ":443"                  # Адрес HTTPS-входа.
  login_compat_addr: "127.0.0.1:7515" # Необязательно: открытый HTTP-порт совместимости для старых CN-клиентов; пусто — выключен.
  realtime_addr: ":9341"              # Адрес realtime-подключения клиента игры.
  cert_file: "certs/server.crt"       # HTTPS-сертификат; создаётся автоматически, если его нет.
  key_file: "certs/server.key"        # Закрытый ключ HTTPS; создаётся автоматически, если его нет.
  advertise_host: "127.0.0.1"         # Realtime-адрес, который возвращается клиенту при входе.
  advertise_port: 9341                # Realtime-порт, который возвращается клиенту при входе.
  region: "RU"                        # Регион клиента (RU — русский интерфейс, CN — китайский).
  server_name: "RF4_566"              # Имя сервера в ответе на вход.
  login_domain: "api.rf4game.ru"      # Основной домен входа и субъект сертификата.
  max_conns: 512                      # Максимум одновременных realtime-подключений.
  ack_client_frames: true             # Отправлять ACK протокола до обработки кадра клиента.
  transport_keepalive_sec: 5.0        # Интервал пустых keepalive-кадров (с).
  obs_addr: ":9501"                   # Адрес проверки работоспособности, метрик и профилирования.
  tunnel:
    addr: "127.0.0.1:9401"                          # Внутренний адрес туннеля gameserver.
    psk: "replace-with-shared-random-secret"        # Должен совпадать с game.tunnel.psk.

  # Значения по умолчанию; ограничения ловли можно переопределить в админ-панели.
  token_ttl_days: 365                 # Срок действия токена входа (дни).
  userid_start: 1000001               # Первый user ID, выдаваемый сервисом входа.
  bite_probability: 1.0               # Вероятность поклёвки на заброс; 1.0 — рыба на каждом забросе.
  bite_delay_scale: 1.0               # Множитель стандартного распределения задержки клёва.
  bite_delay_fixed: 0                 # Фиксированная задержка клёва (с); больше 0 — распределение не используется.
  keepalive_interval_sec: 5.0         # Интервал отправки мировых часов (с); должен быть меньше 10.

game:
  tunnel:
    addr: "127.0.0.1:9401"                          # Внутренний адрес туннеля.
    psk: "replace-with-shared-random-secret"        # Должен совпадать с gateway.tunnel.psk.
  obs_addr: ":9502"                   # Адрес проверки работоспособности, метрик и профилирования.
  default_userid: 1000001             # User ID профиля игрока, создаваемого seed.
  keepalive_interval_sec: 5.0         # Интервал отправки мировых часов (с).
  # Последовательность погоды: при запуске для каждой карты по весам генерируются ясно/малооблачно/облачно/дождь/ливень/гроза.
  weather:
    randomize: true                   # false — фиксированный порядок из шаблона карты.
    cycle_days: 64                    # Длина последовательности для карты в днях, минимум 8.

admin:
  http_addr: ":8080"                          # Только для отдельной отладки cmd/admin; launcher этот порт не слушает.
  jwt_secret: "replace-with-long-random-secret"  # Ключ подписи токенов сессий администратора.
  obs_addr: ":9503"                           # Только для отдельной отладки cmd/admin.
  username: "admin"                           # Имя администратора.
  password: "replace-with-strong-password"   # Пароль администратора; применяется при каждом запуске админки.

# Поддерживаемые переопределения через переменные окружения:
# RF4_LOG_LEVEL, RF4_LOG_FORMAT, RF4_SQLITE_PATH, RF4_SQLITE_STATIC_PATH,
# RF4_GATEWAY_LOGIN_ADDR, RF4_GATEWAY_LOGIN_COMPAT_ADDR, RF4_GATEWAY_REALTIME_ADDR, RF4_GATEWAY_ADVERTISE_HOST,
# RF4_GATEWAY_CERT, RF4_GATEWAY_KEY, RF4_TUNNEL_ADDR, RF4_TUNNEL_PSK,
# RF4_GAME_TUNNEL_PSK, RF4_ADMIN_HTTP_ADDR, RF4_ADMIN_JWT_SECRET, RF4_ADMIN_PASSWORD,
# RF4_GAME_CLIENT_PATH, RF4_GAME_CLIENT_REGION, RF4_GAME_LAUNCH_VIA,
# RF4_GATEWAY_KEEPALIVE_SEC, RF4_KEEPALIVE_INTERVAL_SEC,
# RF4_BITE_PROBABILITY, RF4_GATEWAY_MAX_CONNS.
